:root {
  --bg: #0d110e;
  --card: #121a13;
  --border: rgba(255,255,255,0.07);
  --accent: #5aab6a;
  --accent2: #7ec98a;
  --text: #f0f5f1;
  --muted: #7b8e7e;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: -20%;
  left: 50%;
  transform: translateX(-50%);
  width: 700px;
  height: 500px;
  background: radial-gradient(ellipse, rgba(90,171,106,0.18) 0%, transparent 70%);
  pointer-events: none;
}

.container {
  text-align: center;
  padding: 2rem 1.5rem;
  max-width: 420px;
  width: 100%;
  animation: fadeUp 0.7s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.icon-wrap {
  width: 90px;
  height: 90px;
  border-radius: 22px;
  overflow: hidden;
  margin: 0 auto 1.5rem;
  box-shadow: 0 0 40px rgba(90,171,106,0.35);
}

.icon-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 2rem;
  letter-spacing: -0.5px;
  margin-bottom: 0.5rem;
}

.tagline {
  color: var(--muted);
  font-size: 0.95rem;
  margin-bottom: 2.5rem;
  line-height: 1.6;
}

.store-btn {
  display: flex;
  align-items: center;
  gap: 1rem;
  width: 100%;
  padding: 1rem 1.25rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  text-decoration: none;
  color: var(--text);
  margin-bottom: 0.85rem;
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
}

.store-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(90,171,106,0.08), transparent);
  opacity: 0;
  transition: opacity 0.2s;
}

.store-btn:hover {
  border-color: rgba(90,171,106,0.5);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.store-btn:hover::before { opacity: 1; }

.store-icon {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: #1a221b;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.store-icon svg { width: 24px; height: 24px; }

.store-text { text-align: left; }
.store-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.store-name { font-size: 1rem; font-weight: 600; margin-top: 1px; }

.arrow {
  margin-left: auto;
  color: var(--muted);
  font-size: 1.1rem;
  transition: transform 0.2s, color 0.2s;
}
.store-btn:hover .arrow { transform: translateX(3px); color: var(--accent2); }

.divider {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0.25rem 0 0.85rem;
  color: var(--muted);
  font-size: 0.8rem;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.footer {
  margin-top: 2rem;
  font-size: 0.78rem;
  color: var(--muted);
}
